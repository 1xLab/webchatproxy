name: antigravity-provider-ci

on:
  push:
    branches: [main]
    paths:
      - 'server/providers/antigravity/**'
      - 'server/systemd/webchat-antigravity.service'
      - 'server/mcp/server.py'
      - '.github/workflows/antigravity.yml'
      - '.github/workflows/mcp-router.yml'
  pull_request:
    paths:
      - 'server/providers/antigravity/**'
      - 'server/systemd/webchat-antigravity.service'
      - 'server/mcp/server.py'
      - '.github/workflows/antigravity.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and layout
        run: |
          set -euo pipefail
          node --check providers/antigravity/server.mjs
          bash -n providers/antigravity/engine/install.sh providers/antigravity/engine/login.sh providers/antigravity/engine/start.sh
          grep -Fq 'ANTIGRAVITY_PORT=3240' systemd/webchat-antigravity.service
          grep -Fq 'User=agent' systemd/webchat-antigravity.service
          ! grep -Fq '0.0.0.0' systemd/webchat-antigravity.service
      - name: Mock agy runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/runtime/antigravity"
          cat > "$RUNNER_TEMP/bin/agy" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            --version) echo 'agy 1.1.17';;
            models) printf '%s\n' 'gemini-3.7-flash-high     Gemini 3.7 Flash (High)' 'claude-sonnet-4-6         Claude Sonnet 4.6 (Thinking)';;
            *)
              if [[ " $* " == *' --output-format stream-json '* ]]; then
                echo '{"event":"init","conversation_id":"ci-conv","init":{"cwd":"/tmp","tools":[]}}'
                echo '{"event":"step_update","step_update":{"conversation_id":"ci-conv","step_index":1,"state":"DONE","step_type":"agent_response","text_delta":"ANTIGRAVITY_STREAM_OK"}}'
                echo '{"event":"result","result":{"conversation_id":"ci-conv","status":"SUCCESS","response":"ANTIGRAVITY_STREAM_OK","usage":{"input_tokens":2,"output_tokens":1,"total_tokens":3}}}'
              else
                echo '{"conversation_id":"ci-conv","status":"SUCCESS","response":"ANTIGRAVITY_OK","usage":{"input_tokens":2,"output_tokens":1,"total_tokens":3}}'
              fi
              ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/bin/agy"
          printf 'ci-key\n' > "$RUNNER_TEMP/runtime/antigravity/.api-key"
          chmod 600 "$RUNNER_TEMP/runtime/antigravity/.api-key"
          PATH="$RUNNER_TEMP/bin:$PATH" AGY_BIN="$RUNNER_TEMP/bin/agy" ANTIGRAVITY_API_KEY_FILE="$RUNNER_TEMP/runtime/antigravity/.api-key" ANTIGRAVITY_PORT=3240 node providers/antigravity/server.mjs >"$RUNNER_TEMP/antigravity.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/antigravity.pid"
          for i in {1..30}; do curl -fsS http://127.0.0.1:3240/health && break; sleep 0.2; done
          curl -fsS -H 'Authorization: Bearer ci-key' http://127.0.0.1:3240/v1/models | grep -Fq 'gemini-3.7-flash-high'
          curl -fsS -H 'Authorization: Bearer ci-key' -H 'Content-Type: application/json' -d '{"model":"gemini-3.7-flash-high","messages":[{"role":"user","content":"test"}],"stream":false}' http://127.0.0.1:3240/v1/chat/completions | grep -Fq 'ANTIGRAVITY_OK'
          curl -fsS -N -H 'Authorization: Bearer ci-key' -H 'Content-Type: application/json' -d '{"model":"gemini-3.7-flash-high","messages":[{"role":"user","content":"test"}],"stream":true}' http://127.0.0.1:3240/v1/chat/completions | grep -Fq 'ANTIGRAVITY_STREAM_OK'
          kill "$(cat "$RUNNER_TEMP/antigravity.pid")" || true
