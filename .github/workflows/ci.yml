name: webchatproxy-ci

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run doctor:contract
      - run: bash -n start.sh remote_ia.sh
      - name: Node core must not depend on a web application
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'public_html|/home/[^/]+/public_html|sistema/|webagent/' server \
            --include='*.mjs' --include='*.js'; then
            echo 'ERROR: proxy core contains a dependency on an external web application'
            exit 1
          fi
      - name: start.sh rejects public webroot runtime paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/public_html/runtime
          set +e
          WEBCHAT_RUNTIME_DIR=/tmp/public_html/runtime ./start.sh status >/tmp/webroot-boundary.log 2>&1
          CODE=$?
          set -e
          test "$CODE" = "78"
          grep -q 'must not live under public_html' /tmp/webroot-boundary.log
      - name: Standalone HTTP/auth and control-plane contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/webchatproxy-ci
          WEBCHAT_DISABLE_BROWSER_START=1 \
          WEBCHAT_API_TOKEN=ci-secret \
          WEBCHAT_PORT=3218 \
          WEBCHAT_RUNTIME_DIR=/tmp/webchatproxy-ci \
          node standalone.mjs >/tmp/webchatproxy-ci.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in {1..40}; do
            curl -fsS http://127.0.0.1:3218/health >/tmp/health.json 2>/dev/null && break
            sleep 0.25
          done
          grep -q '"service":"webchat-gateway"' /tmp/health.json
          CODE=$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' http://127.0.0.1:3218/v1/debug/config)
          test "$CODE" = "401"
          AUTH=(-H 'Authorization: Bearer ci-secret')
          curl -fsS "${AUTH[@]}" http://127.0.0.1:3218/v1/debug/config | grep -q '"browser_start_disabled":true'
          curl -fsS "${AUTH[@]}" http://127.0.0.1:3218/v1/debug/runtime | grep -q '"service":"webchat-gateway"'
          READY=$(curl -sS "${AUTH[@]}" -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:3218/ready)
          test "$READY" = "503"

          curl -fsS "${AUTH[@]}" -H 'Content-Type: application/json' \
            -d '{"projects":{"CI Project":{"id":"g-p-ci123","aliases":["ci"]}}}' \
            http://127.0.0.1:3218/v1/projects/import >/tmp/project-import.json
          grep -q '"imported":1' /tmp/project-import.json
          curl -fsS "${AUTH[@]}" http://127.0.0.1:3218/v1/projects >/tmp/projects.json
          grep -q 'g-p-ci123' /tmp/projects.json

          printf 'ci attachment\n' >/tmp/ci-attachment.txt
          curl -fsS "${AUTH[@]}" -H 'Content-Type: text/plain' -H 'X-Filename: ci-attachment.txt' \
            --data-binary @/tmp/ci-attachment.txt http://127.0.0.1:3218/v1/files >/tmp/file.json
          FILE_ID=$(node -e 'const x=require("fs").readFileSync("/tmp/file.json","utf8"); process.stdout.write(JSON.parse(x).file.id)')
          test -n "$FILE_ID"
          curl -fsS "${AUTH[@]}" "http://127.0.0.1:3218/v1/files/$FILE_ID" | grep -q 'ci-attachment.txt'
          curl -fsS -X DELETE "${AUTH[@]}" "http://127.0.0.1:3218/v1/files/$FILE_ID" | grep -q '"deleted":true'
