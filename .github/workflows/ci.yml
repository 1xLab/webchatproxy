name: webchatproxy-v3-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Validate fresh architecture
        run: |
          test "$(find ../.github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f src/core/job-manager.mjs
          test -f src/core/provider-registry.mjs
          test -f src/core/http-provider-adapter.mjs
          grep -Fq "['chatgpt'" src/index.mjs
          grep -Fq "['deepseek'" src/index.mjs
          grep -Fq "['kimi'" src/index.mjs
          grep -Fq "['antigravity'" src/index.mjs
