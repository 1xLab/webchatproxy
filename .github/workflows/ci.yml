name: webchatproxy-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_preflight:
        description: 'Run authenticated pre-production checks on the self-hosted webchatproxy runner'
        required: false
        default: false
        type: boolean

concurrency:
  group: webchatproxy-${{ github.ref }}
  cancel-in-progress: true

env:
  W2A_PIN: 497527dceabfa3f95961e23c291e618c5570f1ac

jobs:
  gateway:
    name: ChatGPT provider contract and integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node package deterministically
        run: npm ci

      - name: Syntax and static checks
        run: npm run check

      - name: Node unit and integration tests
        run: npm test

      - name: Gateway contract doctor
        run: npm run doctor:contract

      - name: Validate shell entrypoints
        run: bash -n start.sh remote_ia.sh test.sh providers/chatgpt/engine/install.sh

      - name: Enforce canonical provider layout
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test -d server/providers/chatgpt
          test -f server/providers/chatgpt/gateway-runtime.mjs
          test -f server/providers/chatgpt/http-api.mjs
          test -f server/providers/chatgpt/web2api-engine.mjs
          test -f server/providers/chatgpt/engine/web2api_bridge.py
          test -f server/providers/chatgpt/engine/requirements.txt
          test -f server/providers/chatgpt/mcp/server.py
          test -f server/providers/chatgpt/mcp/smoke.py
          test ! -e server/lib
          test ! -e server/engine
          test ! -e server/browser-auth.mjs
          test ! -e server/browser-backend.mjs
          test ! -e server/requirements-engine.txt
          test ! -e server/providers/chatgpt/browser/backend.mjs
          ! grep -RInE '(\.\./lib/|\.\/lib/|engine/mcp_proxy\.py|engine/web2api_bridge\.py|requirements-engine\.txt|browser-backend\.mjs)' server \
            --include='*.mjs' --include='*.js' --include='*.py' --include='*.sh' --include='*.service'

      - name: Install actual pinned ChatGPT-Web2API engine
        env:
          WEBCHAT_ENGINE_BOOTSTRAP_PYTHON: python3
        run: ./start.sh engine-install

      - name: Verify installed engine identity and surface
        run: |
          set -euo pipefail
          .venv-chatgpt/bin/python - <<'PY'
          import importlib.metadata
          from chatgpt_web2api.config import Config
          from chatgpt_web2api.cdp_driver import CDPDriver
          from chatgpt_web2api.mcp_server import (
              do_archive_conversation,
              do_chat_completion,
              do_chat_with_gpt,
              do_create_memory,
              do_create_project,
              do_delete_conversation,
              do_delete_memory,
              do_delete_project,
              do_get_conversation,
              do_list_conversations,
              do_list_gpts,
              do_list_memories,
              do_list_models,
              do_list_project_files,
              do_list_projects,
              do_update_project_instructions,
          )
          version = importlib.metadata.version('chatgpt-web2api')
          cfg = Config.load(None)
          assert cfg.server.host in {'127.0.0.1', 'localhost', '::1'}
          assert CDPDriver is not None
          assert all(callable(x) for x in (
              do_archive_conversation, do_chat_completion, do_chat_with_gpt,
              do_create_memory, do_create_project, do_delete_conversation,
              do_delete_memory, do_delete_project, do_get_conversation,
              do_list_conversations, do_list_gpts, do_list_memories,
              do_list_models, do_list_project_files, do_list_projects,
              do_update_project_instructions,
          ))
          print('engine_version=' + version)
          print('engine_full_surface=ok')
          PY
          grep -Fq "$W2A_PIN" providers/chatgpt/engine/requirements.txt

      - name: Node runtime has no legacy browser automation dependency
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(Object.keys(p.dependencies||{}).length) { console.error(p.dependencies); process.exit(1) }'
          ! grep -RInE 'playwright|@kudoai/chatgpt\.js' . \
            --exclude='package-lock.json' --exclude-dir='.venv-chatgpt'

      - name: Proxy must not depend on an external web application
        working-directory: .
        run: |
          set -euo pipefail
          if grep -RInE 'public_html|/home/[^/]+/public_html|sistema/|webagent/' server \
            --include='*.mjs' --include='*.js' --include='*.py'; then
            echo 'ERROR: proxy contains a dependency on an external web application'
            exit 1
          fi

      - name: start.sh rejects public webroot runtime paths
        run: |
          set -euo pipefail
          mkdir -p /tmp/public_html/runtime
          set +e
          WEBCHAT_RUNTIME_DIR=/tmp/public_html/runtime ./start.sh status >/tmp/webroot-boundary.log 2>&1
          CODE=$?
          set -e
          test "$CODE" = "78"
          grep -q 'must not live under public_html' /tmp/webroot-boundary.log

      - name: Standalone HTTP auth and control-plane contract
        run: |
          set -euo pipefail
          rm -rf /tmp/webchatproxy-ci
          WEBCHAT_ENGINE_AUTOSTART=0 \
          WEBCHAT_API_TOKEN=ci-secret \
          WEBCHAT_PORT=3218 \
          WEBCHAT_RUNTIME_DIR=/tmp/webchatproxy-ci \
          node standalone.mjs >/tmp/webchatproxy-ci.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in {1..40}; do
            curl -fsS http://127.0.0.1:3218/health >/tmp/health.json 2>/dev/null && break
            sleep 0.25
          done
          grep -q '"service":"webchat-gateway"' /tmp/health.json
          grep -q '"backend":"chatgpt-web2api"' /tmp/health.json
          CODE=$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' http://127.0.0.1:3218/v1/debug/config)
          test "$CODE" = "401"
          AUTH=(-H 'Authorization: Bearer ci-secret')
          curl -fsS "${AUTH[@]}" http://127.0.0.1:3218/v1/debug/config | grep -q '"backend":"chatgpt-web2api"'
          READY=$(curl -sS "${AUTH[@]}" -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:3218/ready)
          test "$READY" = "503"
          curl -fsS "${AUTH[@]}" -H 'Content-Type: application/json' \
            -d '{"projects":{"CI Project":{"id":"g-p-ci123","aliases":["ci"]}}}' \
            http://127.0.0.1:3218/v1/projects/import >/tmp/project-import.json
          grep -q '"imported":1' /tmp/project-import.json
          curl -fsS "${AUTH[@]}" http://127.0.0.1:3218/v1/projects | grep -q 'g-p-ci123'

  upstream-engine:
    name: Pinned upstream engine test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout exact reviewed upstream commit
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/Octo-Lex/ChatGPT-Web2API.git
          git -C upstream fetch --depth=1 origin "$W2A_PIN"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$W2A_PIN"
      - name: Install upstream development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './upstream[dev]'
      - name: Ruff upstream runtime source for real errors
        run: ruff check upstream/src --select E,F --ignore E402,E501
      - name: Run upstream non-E2E tests
        working-directory: upstream
        env:
          W2A_E2E_RUN: '0'
        run: pytest -m 'not e2e' -q

  production-preflight:
    name: Authenticated production preflight
    needs: [gateway, upstream-engine]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_preflight == true && vars.WEBCHAT_SELF_HOSTED_PREFLIGHT == '1' }}
    runs-on: [self-hosted, linux, webchatproxy]
    timeout-minutes: 20
    steps:
      - name: Verify canonical runtime layout
        working-directory: /home/agent/webchatproxy
        run: |
          set -euo pipefail
          test -d providers/chatgpt
          test -d browser-profile
          test -d runtime
          test -x .venv-chatgpt/bin/python
          test ! -e engine
          test ! -e lib
      - name: Verify installed service
        working-directory: /home/agent/webchatproxy
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3210/health
          curl -fsS http://127.0.0.1:3210/ready
      - name: Authenticated control-plane preflight
        working-directory: /home/agent/webchatproxy
        run: |
          set -euo pipefail
          npm run doctor:control
          curl -fsS -X POST http://127.0.0.1:3210/v1/projects/sync >/tmp/webchat-projects.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/webchat-projects.json")); if(!Array.isArray(x.projects)) process.exit(1)'
          curl -fsS 'http://127.0.0.1:3210/v1/conversations?limit=5' >/tmp/webchat-conversations.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/webchat-conversations.json")); if(!Array.isArray(x.items)) process.exit(1)'
      - name: Authenticated generation smoke
        working-directory: /home/agent/webchatproxy
        run: npm run doctor:live
