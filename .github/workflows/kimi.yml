name: kimi-provider-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: kimi-provider-${{ github.ref }}
  cancel-in-progress: true

env:
  KIMI_PIN: e7269e1fe1a53af7f4050ef88656d9502043514c

jobs:
  kimi-upstream:
    name: Pinned Kimi provider build and contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Validate provider layout and shell
        working-directory: server
        run: |
          set -euo pipefail
          test -f providers/kimi/README.md
          test -f providers/kimi/engine/UPSTREAM.lock
          test -f providers/kimi/engine/patches/runtime-contract.patch
          test -x providers/kimi/engine/install.sh
          test -x providers/kimi/engine/start.sh
          test -x providers/kimi/engine/import-token.sh
          test -f systemd/webchat-kimi.service
          bash -n providers/kimi/engine/install.sh providers/kimi/engine/start.sh providers/kimi/engine/import-token.sh
          grep -Fq "$KIMI_PIN" providers/kimi/engine/UPSTREAM.lock

      - name: Install exact upstream and apply reviewed patches
        working-directory: server
        env:
          KIMI_VENDOR_DIR: ${{ runner.temp }}/kimi-free-api
        run: |
          set -euo pipefail
          ./providers/kimi/engine/install.sh
          test "$(git -C "$KIMI_VENDOR_DIR" rev-parse HEAD)" = "$KIMI_PIN"
          test -x "$KIMI_VENDOR_DIR/kimi-proxy"
          grep -Fq 'host + ":" + port' "$KIMI_VENDOR_DIR/main.go"
          grep -Fq 'if !body.Stream' "$KIMI_VENDOR_DIR/main.go"
          grep -Fq 'path == "/v1/models"' "$KIMI_VENDOR_DIR/main.go"

      - name: Start script fails closed without session token
        working-directory: server
        env:
          KIMI_VENDOR_DIR: ${{ runner.temp }}/kimi-free-api
          KIMI_RUNTIME_DIR: ${{ runner.temp }}/kimi-runtime
        run: |
          set -euo pipefail
          set +e
          ./providers/kimi/engine/start.sh >/tmp/kimi-start.log 2>&1
          code=$?
          set -e
          test "$code" = "78"
          grep -q 'missing Kimi access token' /tmp/kimi-start.log
